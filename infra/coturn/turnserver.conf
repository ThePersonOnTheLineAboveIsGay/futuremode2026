# coturn TURN server config for local development.
# Docs: https://github.com/coturn/coturn

listening-port=3478
tls-listening-port=5349

# Relay port range (must match docker-compose port mappings).
min-relay-port=49152
max-relay-port=49200

# Realm for the relay. For dev, anything is fine.
realm=futuremode.local

# Authentication: use static credentials for dev.
# In production, use a shared secret + time-limited credentials.
lt-cred-mech
static-auth-secret=devturnsecret-change-in-production

# Use fingerprint for STUN/TLS.
fingerprint

# Don't require TLS for dev (avoid cert setup).
no-tls
no-dtls

# Allow loopback (for dev).
allowed-peer-ip=127.0.0.1
allowed-peer-ip=::1

# Logging.
verbose

# User database for static credentials.
# Format: user:realm:password
# Used by LiveKit's TURN credential signing via the shared secret above.
